name: flight-watch
on:
  schedule:
    - cron: "*/10 * * * *"  # GitHub 사정으로 몇 분씩 늦게 돌 수 있음
  workflow_dispatch:
permissions:
  contents: write
concurrency: watch
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright==1.62.0 && python -m playwright install --with-deps chromium
      - run: python watch.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: 이미 알린 편 기록
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add state.json
          git diff --cached --quiet || (git commit -m "state" && git push)
